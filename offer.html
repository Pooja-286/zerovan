<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Make a thoughtful Zerovan offer for a nearby listing." />
    <title>Make an offer — Zerovan</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="offer">
    <div class="flow-page offer-page">
      <header class="flow-header"><a class="brand" href="vendor.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 38 38" fill="none"><path d="M12.4 7.4c4-2.4 8.4-2.3 12.1.2 3.2 2.2 5.4 5.8 5.5 9.6"/><path d="M30 17.2c.1 5.1-2.4 9.4-6.7 11.6-3.7 1.9-8 1.8-11.5-.2"/><path d="M11.8 28.6c-4.3-2.6-6.4-6.9-5.7-11.7.6-4.1 3.1-7.5 6.5-9.5"/><circle cx="12.5" cy="8.2" r="2.3" fill="currentColor"/><circle cx="29.8" cy="17.5" r="2.3" fill="currentColor"/><circle cx="12" cy="28.2" r="2.3" fill="currentColor"/></svg></span><span>Zerovan</span></a><a class="back-link" href="marketplace.html"><span>←</span> Back to marketplace</a></header>
      <main class="offer-layout"><section class="offer-item-panel" id="offer-item-panel" aria-live="polite"></section><section class="offer-form-panel"><p class="eyebrow"><span></span> Vendor application</p><h1>Make a thoughtful offer.</h1><p>Help the seller understand how this item fits your business and when you can collect it.</p><form id="offer-form" novalidate><input type="hidden" name="itemId" id="offer-item-id" /><label class="field-label">Your offer<input type="text" id="offer-amount" name="amount" inputmode="numeric" required /></label><label class="field-label">Message to the seller<textarea name="message" required rows="5" placeholder="Introduce your business and share how you would give this item a useful next life."></textarea></label><label class="field-label">Preferred collection window<select name="pickup" required><option value="">Choose a window</option><option>Within 24 hours</option><option>Within 2–3 days</option><option>This weekend</option></select></label><label class="check-label"><input type="checkbox" name="confirm" required /><span>I understand that the seller decides which offer to accept.</span></label><p class="form-feedback" id="offer-feedback" aria-live="polite"></p><button class="button button-primary button-full" type="submit">Send application <span>→</span></button></form></section></main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
